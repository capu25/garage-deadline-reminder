name: Deploy Angular to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      environment_note:
        description: 'Nota opzionale per questo deploy'
        required: false
        default: 'Deploy manuale'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production --base-href /garage-deadline-reminder/ --output-path dist/pages-build

      - name: Prepare Pages Folder & 404 Fallback
        run: |
          mkdir -p dist/final-pages
          if [ -d "dist/pages-build/browser" ]; then
            cp -r dist/pages-build/browser/* dist/final-pages/
          else
            cp -r dist/pages-build/* dist/final-pages/
          fi
          cp dist/final-pages/index.html dist/final-pages/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/final-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
